copyright = '2026-2027 Harley Eades III'
instagram = 'harleyeadeslifts'
subtitle = 'Academic, Olympic Weightlifting Coach, Designer'

[menus]
  [[menus.main]]
    name = 'Menu'
    pageRef = '/'
    weight = 1
  
  [[menus.main]]
    name = 'Coaching'
    pageRef = '/coaching'
    weight = 2
  
  [[menus.main]]
    name = 'Academic'
    url = "/academic"
    weight = 2

  [[menus.academic]]
    name = 'Menu'
    pageRef = '/'
    weight = 1

  [[menus.academic]]
    name = 'Home'
    pageRef = '/academic'
    weight = 2

  [[menus.academic]]
    name = 'Activity'
    pageRef = 'activity/'
    weight = 3
  [[menus.coaching]]
    name = 'Menu'
    pageRef = '/'
    weight = 1

  [[menus.coaching]]
    name = 'Home'
    pageRef = '/coaching'
    weight = 2

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[security.exec]
  allow = ["^(dart-)?sass$", "^go$", "^git$", "^node$", "^postcss$", "^tailwindcss$"]

[build]
  [buildStats]
    enable = true